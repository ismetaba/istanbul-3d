<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Istanbul · Beşiktaş — Capa</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar" class="topbar">
        <div class="topbar__title">
          <span class="topbar__city">Istanbul</span>
          <span class="topbar__sep">·</span>
          <div class="topbar__district-wrap">
            <button
              id="district-trigger"
              class="topbar__district"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="district-popover"
            >
              Beşiktaş <span aria-hidden="true" class="topbar__caret">▾</span>
            </button>
            <ul
              id="district-popover"
              class="district-popover"
              role="listbox"
              aria-label="Switch district"
              hidden
            ></ul>
          </div>
        </div>

        <form id="topbar-search" class="topbar__search" role="search" autocomplete="off">
          <input
            id="search-input"
            class="topbar__search-input"
            type="text"
            placeholder="search address / osm-id …"
            aria-label="Search"
          />
        </form>

        <div class="topbar__actions">
          <button
            id="filter-toggle"
            class="topbar__action topbar__action--filter"
            type="button"
            aria-controls="filters"
            aria-expanded="false"
          >
            ☰ Filters
          </button>
          <button
            id="toggle-night"
            class="topbar__action"
            type="button"
            aria-pressed="false"
          >
            🌙 Night
          </button>
        </div>
      </header>

      <div
        id="filter-backdrop"
        class="filter-backdrop"
        hidden
        aria-hidden="true"
      ></div>

      <aside id="filters" class="filters" aria-label="Filters">
        <h2 class="filters__heading">Filters</h2>

        <fieldset class="filter">
          <legend class="filter__legend">Status</legend>
          <label class="check"
            ><input type="checkbox" name="status" value="for_sale" checked /><span
              class="check__dot check__dot--good"
            ></span>
            For sale</label
          >
          <label class="check"
            ><input type="checkbox" name="status" value="for_rent" checked /><span
              class="check__dot check__dot--warn"
            ></span>
            For rent</label
          >
          <label class="check"
            ><input type="checkbox" name="status" value="off_market" checked /><span
              class="check__dot check__dot--muted"
            ></span>
            Off-market</label
          >
        </fieldset>

        <fieldset class="filter">
          <legend class="filter__legend">Type</legend>
          <div id="type-chips" class="chips" role="group" aria-label="Property type">
            <!-- chips injected by main.js -->
          </div>
        </fieldset>

        <fieldset class="filter">
          <legend class="filter__legend">
            Price <span class="filter__readout" id="price-readout">— · —</span>
          </legend>
          <div class="dualrange" data-min="5000000" data-max="100000000" data-step="500000">
            <input
              type="range"
              class="dualrange__min"
              id="price-min"
              min="5000000"
              max="100000000"
              step="500000"
              value="5000000"
              aria-label="Minimum price"
            />
            <input
              type="range"
              class="dualrange__max"
              id="price-max"
              min="5000000"
              max="100000000"
              step="500000"
              value="100000000"
              aria-label="Maximum price"
            />
            <div class="dualrange__track" aria-hidden="true">
              <span class="dualrange__fill" id="price-fill"></span>
            </div>
          </div>
          <p class="filter__hint">TRY · sale price (rentals always shown if status on).</p>
        </fieldset>

        <fieldset class="filter">
          <legend class="filter__legend">
            Size <span class="filter__readout" id="size-readout">— · —</span>
          </legend>
          <div class="dualrange" data-min="60" data-max="300" data-step="5">
            <input
              type="range"
              class="dualrange__min"
              id="size-min"
              min="60"
              max="300"
              step="5"
              value="60"
              aria-label="Minimum size m²"
            />
            <input
              type="range"
              class="dualrange__max"
              id="size-max"
              min="60"
              max="300"
              step="5"
              value="300"
              aria-label="Maximum size m²"
            />
            <div class="dualrange__track" aria-hidden="true">
              <span class="dualrange__fill" id="size-fill"></span>
            </div>
          </div>
        </fieldset>

        <fieldset class="filter">
          <legend class="filter__legend">Address</legend>
          <input
            id="addr-input"
            class="textbox"
            type="text"
            placeholder="street name or osm_id"
          />
        </fieldset>
      </aside>

      <div id="cesium" class="cesium-host"></div>

      <!-- Boot overlay: covers the cesium grid cell while listings + geojson load.
           Removed once first paint completes; replaced in-place on fetch error. -->
      <div id="boot-overlay" class="boot-overlay" role="status" aria-live="polite">
        <div id="boot-overlay-card" class="boot-overlay__card">
          <span class="boot-overlay__spinner" aria-hidden="true"></span>
          <span id="boot-overlay-label" class="boot-overlay__label">Loading Beşiktaş…</span>
        </div>
      </div>

      <aside id="results" class="results" aria-label="Results">
        <button
          id="sheet-handle"
          class="results__sheet-handle"
          type="button"
          aria-label="Expand results"
          aria-expanded="false"
        >
          <span class="results__sheet-grip" aria-hidden="true"></span>
          <span id="sheet-handle-count" class="results__sheet-count">Results</span>
          <span
            id="sheet-handle-filters"
            class="results__sheet-filters-chip"
            role="button"
            tabindex="0"
            aria-label="Open filters"
          >Filters</span>
        </button>
        <div class="results__bar" id="results-bar" hidden>
          <span id="results-bar-count">Showing 0 of 0</span>
          <button id="results-reset" type="button" class="linklike">Reset</button>
        </div>

        <div
          id="district-empty"
          class="district-empty"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <ol id="results-list" class="results__list" aria-live="polite">
          <!-- Skeleton rows shown while listings load. main.js clobbers
               innerHTML on first paint, which removes them. -->
          <li class="results__skeleton" aria-hidden="true"></li>
          <li class="results__skeleton" aria-hidden="true"></li>
          <li class="results__skeleton" aria-hidden="true"></li>
        </ol>

        <section id="panel" class="panel panel--hidden" aria-live="polite" hidden>
          <button id="panel-close" class="panel__close" type="button" aria-label="Close">
            ×
          </button>
          <div id="panel-body" class="panel__body"></div>
        </section>
      </aside>

      <footer id="footer" class="footer">
        <p class="footer__attr">© OpenStreetMap contributors · ODbL</p>
      </footer>
    </div>
    <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
