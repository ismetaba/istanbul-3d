name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # `VITE_BASE` matches the GitHub Pages project subpath so `import.meta.env.BASE_URL`
      # resolves to e.g. /istanbul-3d/ in production. Local dev still serves at /.
      - name: Compute base path
        id: base
        run: echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
      # CAPAAA-48: pipe optional photoreal secrets into the build. When unset
      # they are empty strings — `enablePhotoreal` short-circuits silently and
      # the deploy renders the v0 OSM-imagery view. Set both repo secrets to
      # ship the photoreal mesh on the deployed URL. Google Maps Platform key
      # *must* be HTTP-referrer-restricted in GCP console (it ships in the JS
      # bundle by Google's design — referrer restrictions are the security
      # mechanism for client-side Maps APIs).
      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
